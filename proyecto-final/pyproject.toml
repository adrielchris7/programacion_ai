[project]
name = "proyecto-final"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "adrielchris7", email = "adrielchris7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2,<3",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[project.scripts]
proyecto-final = "proyecto_final:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pandas>=3.1.0",
]
